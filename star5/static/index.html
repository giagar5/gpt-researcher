<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Star5 Search</title>
<link rel="icon" href="/s5/icon-192.png?v=6" type="image/png">
<link rel="apple-touch-icon" href="/s5/apple-touch-icon.png?v=6">
<link rel="manifest" href="/s5/manifest.json">
<meta name="theme-color" content="#f4f6ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221f2c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Star5 Search">
<link rel="stylesheet" href="/s5/app.css">
<script src="/s5/vendor/showdown.min.js" defer></script>
<script src="/s5/vendor/purify.min.js" defer></script>
<script src="/s5/i18n.js" defer></script>
<script src="/s5/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside id="side" class="side" aria-label="Menu">
    <div class="side-head">
      <a class="brand" href="#/"><img class="logo" src="/s5/icon-192.png?v=6" alt="" width="32" height="32"><span>Star5 <b>Search</b></span></a>
      <button type="button" class="icon-btn only-mobile" id="sideClose" data-i18n-title="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <a class="new-btn" href="#/" id="newBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="new"></span>
    </a>
    <div class="lib-head">
      <span data-i18n="library"></span>
    </div>
    <label class="lib-search">
      <span class="sr" data-i18n="searchLib"></span>
      <input type="search" id="libFilter" autocomplete="off" data-i18n-ph="searchLib">
    </label>
    <nav id="lib" class="lib" aria-live="polite"></nav>
    <div class="side-foot">
      <label class="ui-lang">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="sr" data-i18n="uiLanguage"></span>
        <select id="uiLang">
          <option value="it">Italiano</option>
          <option value="fr">Français</option>
          <option value="en">English</option>
        </select>
      </label>
      <button type="button" class="install-btn" id="installBtn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span data-i18n="install"></span>
      </button>
    </div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <div class="main">
    <header class="mtop only-mobile">
      <button type="button" class="icon-btn" id="menuBtn" data-i18n-title="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/"><img class="logo" src="/s5/icon-192.png?v=6" alt="" width="32" height="32"><span>Star5 <b>Search</b></span></a>
      <a class="icon-btn" href="#/" data-i18n-title="new">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </header>

    <div id="banner" class="banner" role="alert" hidden></div>

    <section id="home" class="home" hidden>
      <h1 data-i18n="hero"></h1>
      <form id="ask" class="composer big" autocomplete="off">
        <label class="sr" for="q" data-i18n="placeholder"></label>
        <textarea id="q" rows="2" maxlength="2000" data-i18n-ph="placeholder" required></textarea>
        <div class="attach-list" hidden></div>
        <div class="composer-bar">
          <div class="seg" role="radiogroup" id="modes" data-i18n-aria="mode"></div>
          <div class="bar-right">
            <div class="tools">
              <button type="button" class="tool" data-act="attach" data-i18n-title="attach"></button>
              <button type="button" class="tool" data-act="record" data-i18n-title="record"></button>
              <button type="button" class="tool" data-act="locate" data-i18n-title="locate"></button>
              <input type="file" class="picker" multiple hidden>
            </div>
            <button type="button" class="chip" id="optBtn" aria-expanded="false" aria-controls="opts">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
              <span data-i18n="options"></span>
            </button>
            <button type="submit" class="send" data-i18n-title="search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div id="opts" class="opts" hidden>
          <label><span data-i18n="answerLang"></span>
            <select id="lang"></select></label>
          <label><span data-i18n="tone"></span>
            <select id="tone"></select></label>
          <label><span data-i18n="effort"></span>
            <select id="effort"></select></label>
          <label><span data-i18n="sites"></span>
            <span class="range"><input type="range" id="sites" min="3" max="15" step="1"><output id="sitesOut"></output></span></label>
        </div>
      </form>
      <p class="mode-hint" id="modeHint"></p>
      <div class="recent" id="recentBox">
        <div class="recent-h"><span id="recentTitle"></span><button type="button" class="link-btn" id="recentAll" hidden></button></div>
        <div class="recent-list" id="recent"></div>
      </div>
    </section>

    <section id="thread" class="thread" hidden>
      <div class="thread-total" id="threadTotal" hidden></div>
      <div id="turns"></div>
      <form id="follow" class="composer follow" autocomplete="off">
        <button type="button" class="to-bottom" id="toBottom" data-i18n-title="toBottom" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </button>
        <label class="sr" for="fq" data-i18n="followPh"></label>
        <textarea id="fq" rows="1" maxlength="2000" data-i18n-ph="followPh" required></textarea>
        <div class="attach-list" hidden></div>
        <div class="composer-bar">
          <div class="seg-row">
            <div class="seg small" role="radiogroup" id="kinds"></div>
            <div class="seg small" role="radiogroup" id="fmodes" data-i18n-aria="mode" hidden></div>
          </div>
          <div class="bar-right">
            <div class="tools">
              <button type="button" class="tool" data-act="attach" data-i18n-title="attach"></button>
              <button type="button" class="tool" data-act="record" data-i18n-title="record"></button>
              <button type="button" class="tool" data-act="locate" data-i18n-title="locate"></button>
              <input type="file" class="picker" multiple hidden>
            </div>
            <button type="button" class="chip opt-chip" id="fOptBtn" aria-expanded="false" aria-controls="fopts" data-i18n-title="options">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
              <span data-i18n="options"></span>
            </button>
            <button type="submit" class="send" data-i18n-title="send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div id="fopts" class="opts" hidden>
          <label><span data-i18n="answerLang"></span>
            <select id="flang"></select></label>
          <label><span data-i18n="tone"></span>
            <select id="ftone"></select></label>
          <label><span data-i18n="effort"></span>
            <select id="feffort"></select></label>
          <label><span data-i18n="sites"></span>
            <span class="range"><input type="range" id="fsites" min="3" max="15" step="1"><output id="fsitesOut"></output></span></label>
        </div>
      </form>
    </section>
    <nav id="rail" class="rail" data-i18n-aria="navConv" hidden></nav>

    <section id="missing" class="home" hidden>
      <h1 data-i18n="notFound"></h1>
      <p><a href="#/" data-i18n="new"></a></p>
    </section>
  </div>
</div>

<template id="turnTpl">
  <article class="turn">
    <h2 class="q"></h2>
    <div class="meta"></div>
    <div class="att-row" hidden></div>
    <details class="brief" hidden><summary data-i18n="brief"></summary><p></p></details>
    <div class="progress" hidden>
      <ol class="steps"></ol>
      <ul class="queries" hidden></ul>
      <div class="prog-foot">
        <span class="elapsed"></span>
        <button type="button" class="link-btn cancel" data-i18n="cancel"></button>
      </div>
      <details class="log" hidden><summary data-i18n="details"></summary><ol></ol></details>
    </div>
    <div class="sources" hidden>
      <div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg><span class="src-title"></span>
        <button type="button" class="link-btn all" hidden></button></div>
      <div class="engines" hidden></div>
      <div class="cards"></div>
      <div class="grouped" hidden></div>
    </div>
    <div class="answer-wrap" hidden>
      <div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z"/></svg><span data-i18n="answer"></span></div>
      <details class="toc" hidden><summary data-i18n="toc"></summary><ol></ol></details>
      <div class="answer md"></div>
    </div>
    <div class="failed" hidden></div>
    <div class="actions" hidden></div>
  </article>
</template>
</body>
</html>
