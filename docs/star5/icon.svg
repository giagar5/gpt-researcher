    <path d="M38 32 49.8 48.2 38 40.4Z" fill="#2a95b8"/>
    <path d="M38 32 38 40.4 26.2 48.2Z" fill="#62d2e2"/>
    <path d="M38 32 26.2 48.2 30 34.6Z" fill="#1f7fa6"/>
    <path d="M38 32 30 34.6 19 25.8Z" fill="#aef7ee"/>
    <path d="M38 32 19 25.8 33.1 25.2Z" fill="#4cc3d8"/>
